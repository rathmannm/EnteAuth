# Ente Auth — self-hosted, Auth-only stack for Dockhand
# Museum (API server) + Postgres. No MinIO/S3: not needed for Auth.
#
# ALL secrets come from Dockhand's env-var UI (stored AES-256-GCM encrypted).
# museum.yaml in this repo contains NO secrets — env vars override it at runtime.
# Set these in Dockhand (see README.md):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, ENTE_API_ORIGIN,
#   ENTE_KEY_ENCRYPTION, ENTE_KEY_HASH, ENTE_JWT_SECRET

services:
  museum:
    image: ghcr.io/ente/server:latest
    container_name: ente-museum
    restart: unless-stopped
    ports:
      - "8080:8080"          # Museum API — put your reverse proxy in front of this
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENTE_DB_HOST: postgres
      ENTE_DB_PORT: "5432"
      ENTE_DB_NAME: ${POSTGRES_DB}
      ENTE_DB_USER: ${POSTGRES_USER}
      ENTE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      ENTE_API_ORIGIN: ${ENTE_API_ORIGIN}
      ENTE_KEY_ENCRYPTION: ${ENTE_KEY_ENCRYPTION}
      ENTE_KEY_HASH: ${ENTE_KEY_HASH}
      ENTE_JWT_SECRET: ${ENTE_JWT_SECRET}
    volumes:
      - ./museum.yaml:/museum.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:15-trixie
    container_name: ente-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: pg_isready -q -d ${POSTGRES_DB} -U ${POSTGRES_USER}
      start_period: 30s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
